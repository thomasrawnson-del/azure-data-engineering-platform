name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  aws-integration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect OIDC token claims
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          request = urllib.request.Request(
              url + "&audience=sts.amazonaws.com",
              headers={
                  "Authorization": f"bearer {token}"
              },
          )

          with urllib.request.urlopen(request, timeout=10) as response:
              data = json.load(response)

          jwt = data["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "ref",
          ]:
              print(f"{key}: {claims.get(key)}")
          PY
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::302726986384:role/aws-data-engineering-platform-github-actions
          aws-region: eu-west-2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::302726986384:role/aws-data-engineering-platform-github-actions
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify S3 access
        run: aws s3api head-bucket --bucket tom-data-engineering-platform
